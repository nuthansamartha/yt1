version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MAX_DOWNLOAD_SIZE_GB=10
      - JOB_EXPIRATION_MINUTES=30
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - downloads_data:/app/downloads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  downloads_data:
